<div class="game-btn-group">
  <button
    *ngFor="let game of games"
    class="game-pill-btn"
    [class.active]="game.id === currentId"
    (click)="select(game.id)">
    <mat-icon class="game-btn-icon">{{game.id === 1 ? 'grid_view' : 'animation'}}</mat-icon>
    <span>{{game.name}}</span>
  </button>
</div>
