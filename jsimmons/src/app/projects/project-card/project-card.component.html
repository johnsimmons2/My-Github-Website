<mat-card class="project-card">
  <mat-card-header>
    <div class="project-card__title">
      <p class="eyebrow">Open source</p>
      <h3>{{ name }}</h3>
    </div>
    <mat-chip-set *ngIf="languages.length" aria-label="Languages" class="language-chips">
      <mat-chip *ngFor="let language of orderByCount(languages); let first = first" color="primary" [highlighted]="first">
        {{ language.language }}
      </mat-chip>
    </mat-chip-set>
  </mat-card-header>
  <mat-card-content>
    <p class="muted" *ngIf="!description">No description provided yet.</p>
    <p *ngIf="description">{{ description }}</p>
    <div class="card-actions">
      <button mat-stroked-button color="primary" (click)="navigate()">
        View repository
        <mat-icon>arrow_right</mat-icon>
      </button>
    </div>
  </mat-card-content>
</mat-card>
