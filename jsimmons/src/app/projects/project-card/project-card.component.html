<div class="modern-card repo-card interactive">
  <div class="repo-header">
    <div class="repo-title-group">
      <div class="repo-icon">
        <mat-icon>folder_open</mat-icon>
      </div>
      <h3 class="repo-name">{{name}}</h3>
    </div>
    <button class="repo-action-btn" (click)="navigate()" aria-label="View on GitHub">
      <span>GitHub</span>
      <mat-icon>open_in_new</mat-icon>
    </button>
  </div>

  <p class="repo-description">{{description}}</p>

  <div class="repo-footer" *ngIf="languages && languages.length > 0">
    <div class="lang-pills">
      <span *ngFor="let lang of languages.slice(0, 4); let first = first" class="pill-badge" [class.cyan]="first" [class.neutral]="!first">
        {{lang.language}}
      </span>
    </div>
  </div>
</div>
